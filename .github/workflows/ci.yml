name: ci

# Runs on every PR and on pushes to main. Read-only permissions; fork PRs get no
# secrets, so running the installer/eval here cannot exfiltrate anything.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          jq empty manifest.json
          jq empty .mcp.json.template
          jq empty .claude-plugin/marketplace.json .claude-plugin/plugin.json plugin/hooks/hooks.json plugin/schema/keel.policy.schema.json package.json

      - name: Shell syntax
        run: |
          bash -n install.sh bin/keel-approve
          for f in evals/*.sh evals/gates/*.sh; do bash -n "$f"; done

      - name: Shellcheck
        run: shellcheck -S warning install.sh bin/keel-approve evals/*.sh evals/gates/*.sh

      - name: Install regression eval
        run: bash evals/install-regression.sh

      - name: keel-approve regression eval
        run: bash evals/keel-approve-regression.sh

      - name: No secrets committed
        run: |
          if git ls-files | grep -qx '.mcp.json'; then
            echo "::error::.mcp.json (real credentials) must not be committed — only .mcp.json.template"
            exit 1
          fi
          if git grep -nEI '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,})' \
               -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::possible secret found in tracked files"
            exit 1
          fi
          echo "no obvious secrets"

  plugin:
    # Keel v3 gates: decision table, end-to-end hooks, compiler, doctor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the limits ratchet compares a PR with its base

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Every gate hook fails closed
        run: |
          jq -e '[.hooks.PreToolUse[].hooks[] | select(.onFailure != "block")] | length == 0' plugin/hooks/hooks.json

      - name: Clean-code limits (D20e, fail mode, files this PR changes)
        # Keel holds itself to the limits it compiles into projects: no changed file gets worse than
        # its base (file length, function length, line length, complexity); new files meet the caps.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node plugin/ci/keel-ci.mjs limits --mode=fail

      - name: Plugin tests
        run: node --test plugin/test/*.test.mjs

      - name: keel init + compile + doctor on a throwaway repo
        run: |
          set -e
          d=$(mktemp -d); git -C "$d" init -q -b main
          node plugin/bin/keel.mjs init --dir "$d" >/dev/null
          node plugin/bin/keel.mjs compile --dir "$d" >/dev/null
          node plugin/bin/keel.mjs doctor --dir "$d" --offline --allow-unproven || true
          test -f "$d/.keel/policy.lock.json" && grep -q '^# >>> keel-v2 arbiter' "$d/CLAUDE.md" && grep -q '^# >>> keel standing authorization' "$d/CLAUDE.md"
          test -f "$d/CONTEXT.md" && test -f "$d/GLOSSARY.md" && test -f "$d/CODING_STANDARDS.md" && test -f "$d/DESIGN.md" && test -f "$d/.scratch/README.md"
          test -f "$d/LAWS.md" && test -f "$d/LEARNINGS.md" && test -f "$d/docs/INDEX.md" && test -f "$d/docs/ARCHITECTURE.md"

      - name: Tier-1 budget (D20a) — a fresh CLAUDE.md + its import stay within ~80 lines / ~1.5k tokens (est.)
        run: |
          d=$(mktemp -d); git -C "$d" init -q -b main
          node plugin/bin/keel.mjs init --dir "$d" >/dev/null
          lines=$(cat "$d/CLAUDE.md" "$d/docs/INDEX.md" | wc -l)
          tokens=$(node --input-type=module -e "import { estimateTokens } from './plugin/ci/keel-ci.mjs'; import fs from 'node:fs'; console.log(estimateTokens(fs.readFileSync('$d/CLAUDE.md', 'utf8') + fs.readFileSync('$d/docs/INDEX.md', 'utf8')))")
          echo "Tier 1: $lines lines, ~$tokens tokens (est., conservative; not tokenizer-measured)"
          test "$lines" -le 80 && test "$tokens" -le 1500
